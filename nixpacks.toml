[variables]
NIXPACKS_PHP_VERSION = "8.4"
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mysqli", "php84Extensions.mbstring", "php84Extensions.openssl", "php84Extensions.tokenizer", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.filter", "php84Packages.composer", "nodejs_22", "nginx"]

[phases.build]
cmds = ["npm ci || npm install", "npm run build", "composer install --optimize-autoloader --no-dev", "php artisan config:cache || true", "php artisan route:cache || true", "php artisan view:cache || true"]

[phases.prestart]
cmds = ["php artisan migrate --force || true", "php artisan db:seed --class=UserSeeder --force || true"]
